data:
  label_column: class_category
  allowed_classes: null
  label_filters:
    train:
      include: [real_good, fake_good, real_bad, fake_bad, manipulated_bad]
      exclude: null
    validation:
      include: [real_good, fake_good, real_bad, fake_bad, manipulated_bad]
      exclude: null

model:
  family: metaclip2_coop
  name: facebook/metaclip-2-worldwide-s16
  pretrained: true
  num_classes: 5

coop:
  n_ctx: 16
  class_specific_context: false
  context_std: 0.02

training:
  epochs: 20
  per_device_batch_size: 16
  gradient_accumulation_steps: 4
  effective_batch_size: 256
  mixed_precision: bf16
  max_grad_norm: 1.0
  compile: false

optimizer:
  lr: 0.002
  weight_decay: 0.0

scheduler:
  warmup_epochs: 2
  min_lr_ratio: 0.01

augmentations:
  horizontal_flip_prob: 0.5
  vertical_flip_prob: 0.0
  rotation_degrees: 5
  color_jitter:
    enabled: false
  random_erasing_prob: 0.0
  auto_augment: null
  rand_augment: null
  mixup_alpha: 0.0
  cutmix_alpha: 0.0
  label_smoothing: 0.0

checkpoint:
  monitor: macro_f1
  mode: max
