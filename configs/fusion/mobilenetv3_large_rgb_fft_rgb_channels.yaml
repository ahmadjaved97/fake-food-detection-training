frequency:
  mode: fft_magnitude
  channel_mode: rgb
  normalization:
    mode: fixed_minmax

fusion:
  hidden_dim: 512
  dropout: 0.2

model:
  family: rgb_fft_fusion_timm
  name: mobilenetv3_large_100.ra_in1k
  pretrained: true
  num_classes: null

training:
  epochs: 70
  per_device_batch_size: 32
  gradient_accumulation_steps: 2
  effective_batch_size: 256

data:
  label_column: data_category
  allowed_classes:
    - real_good
    - real_bad
    - fake_good
    - fake_bad
    - manipulated_bad

optimizer:
  lr: 0.00025
  weight_decay: 0.0001

scheduler:
  warmup_epochs: 5

augmentations:
  horizontal_flip_prob: 0.0
  vertical_flip_prob: 0.0
  rotation_degrees: 0
  color_jitter:
    enabled: false
  random_erasing_prob: 0.0
  auto_augment: null
  rand_augment: null
  mixup_alpha: 0.0
  cutmix_alpha: 0.0
  label_smoothing: 0.0

logging:
  wandb:
    project: fake-food-fusion
    tags: [rgb_fft, rgb_channel_fft, late_fusion, mobilenetv3_large]
