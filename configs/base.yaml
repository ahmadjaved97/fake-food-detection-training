seed: 42
deterministic: false

data:
  num_workers: 8
  pin_memory: true
  validate_files: true
  return_paths: false
  # null means auto-detect class_category first, then category.
  label_column: null
  # "skip" logs missing images and continues. Use "error" to fail fast.
  missing_files_policy: skip
  allowed_classes:
    - real_good
    - real_bad
    - fake_good
    - fake_bad
    - manipulated_bad

model:
  name: resnet50
  pretrained: true
  num_classes: 5

training:
  epochs: 60
  per_device_batch_size: 32
  gradient_accumulation_steps: 2
  effective_batch_size: 256
  enforce_effective_batch_size: true
  mixed_precision: bf16
  max_grad_norm: 1.0
  compile: false

optimizer:
  lr: 0.0003
  weight_decay: 0.0001
  betas: [0.9, 0.999]
  eps: 0.00000001
  no_weight_decay_for_bias_norm: true

scheduler:
  warmup_epochs: 5
  warmup_ratio: null
  min_lr_ratio: 0.01

augmentations:
  random_erasing_prob: 0.0
  auto_augment: null
  rand_augment: null
  mixup_alpha: 0.0
  cutmix_alpha: 0.0
  label_smoothing: 0.0

imbalance:
  class_weights:
    enabled: false
    mode: inverse_frequency
  weighted_sampler:
    enabled: false
    replacement: true
  focal_loss:
    enabled: false
    gamma: 2.0

metrics:
  enable_auc: false

logging:
  log_every_steps: 50
  wandb:
    enabled: true
    project: fake-food-detection
    entity: null
    # Set to "offline" on compute nodes without internet, then sync from a login node.
    mode: online
    tags: []
  tensorboard:
    enabled: false
  wrong_examples:
    enabled: true
    max_images: 16

checkpoint:
  save_epoch_checkpoints: false
  save_every_n_epochs: 1
  monitor: accuracy
  mode: max
