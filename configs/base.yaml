seed: 42
deterministic: false

data:
  num_workers: 8
  pin_memory: true
  validate_files: true
  return_paths: false
  # null means auto-detect class_category first, then category.
  label_column: data_category
  # "skip" logs missing images and continues. Use "error" to fail fast.
  missing_files_policy: skip
  # Optional explicit label allow-list. null means infer labels from the selected train CSV column.
  # When set, rows with other target labels are filtered out and class order follows this list.
  allowed_classes: null
  # Optional target-label filters by split. Values refer to the selected label_column after normalization.
  # Example:
  #   train:
  #     include: [real_good, fake_good, fake_bad]
  #     exclude: null
  #   validation:
  #     include: [real_good, fake_good, fake_bad]
  #     exclude: null
  label_filters:
    train:
      include: null
      exclude: null
    validation:
      include: null
      exclude: null
  # Optional filters on any CSV metadata column. Useful for domain holdouts, e.g. train without
  # one generator_model and validate only on that generator_model while keeping label_column fixed.
  # include/exclude are mappings from column name to one or more accepted/rejected values.
  row_filters:
    train:
      include: {}
      exclude: {}
    validation:
      include: {}
      exclude: {}

model:
  name: resnet50
  pretrained: true
  # null means infer num_classes from the selected train CSV label column.
  num_classes: null

training:
  epochs: 60
  per_device_batch_size: 32
  gradient_accumulation_steps: 2
  effective_batch_size: 256
  enforce_effective_batch_size: true
  mixed_precision: bf16
  max_grad_norm: 1.0
  compile: false

optimizer:
  lr: 0.0003
  weight_decay: 0.0001
  betas: [0.9, 0.999]
  eps: 0.00000001
  no_weight_decay_for_bias_norm: true

scheduler:
  warmup_epochs: 5
  warmup_ratio: null
  min_lr_ratio: 0.01

augmentations:
  horizontal_flip_prob: 0.5
  vertical_flip_prob: 0.0
  rotation_degrees: 0
  color_jitter:
    enabled: false
    brightness: 0.1
    contrast: 0.1
    saturation: 0.1
    hue: 0.0
  random_erasing_prob: 0.0
  auto_augment: null
  rand_augment: null
  mixup_alpha: 0.0
  cutmix_alpha: 0.0
  label_smoothing: 0.0

imbalance:
  class_weights:
    enabled: false
    mode: inverse_frequency
  weighted_sampler:
    enabled: false
    replacement: true
    # Shared across all ranks so weighted sampling is coordinated under Accelerate.
    # null means use the top-level seed.
    seed: null
  focal_loss:
    enabled: false
    gamma: 2.0

metrics:
  enable_auc: false

logging:
  log_every_steps: 50
  wandb:
    enabled: true
    project: fake-food-v1
    entity: null
    # Set to "offline" on compute nodes without internet, then sync from a login node.
    mode: online
    tags: []
  tensorboard:
    enabled: false
  wrong_examples:
    enabled: true
    max_images: 5

checkpoint:
  save_epoch_checkpoints: false
  save_every_n_epochs: 1
  monitor: macro_f1
  mode: max
