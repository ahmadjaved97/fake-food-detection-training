model:
  name: vit_small_plus_patch16_dinov3.lvd1689m
  pretrained: true
  num_classes: null
  freeze_backbone: false
  input_size: 224

optimizer:
  lr: 1e-4
  weight_decay: 0.05

training:
  epochs: 10

scheduler:
  warmup_epochs: 1
  min_lr_ratio: 0.01

checkpoint:
  save_epoch_checkpoints: false   # best_macro_f1.pt and final.pt are still saved
  monitor: macro_f1
  mode: max