model:
  name: mobilenetv3_large_100.ra_in1k
training:
  epochs: 10
optimizer:
  lr: 5e-4
  weight_decay: 0.01

scheduler:
  warmup_epochs: 1
  min_lr_ratio: 0.01

checkpoint:
  save_epoch_checkpoints: false   # best_macro_f1.pt and final.pt are still saved
  monitor: macro_f1
  mode: max

logging:
  wandb:
    enabled: true
    project: fake-food-rgb-ablation     # new project, so old runs don't mix into the new comparison
    entity: null
    mode: offline                       # your nodes have no internet; sync with scripts/sync_wandb_loop.sh
    tags: [rgb, baseline_10ep]          # swap the 2nd tag per experiment, see below
  wrong_examples:
    enabled: true
    max_images: 5